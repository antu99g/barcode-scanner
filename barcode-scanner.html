<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        input { font-size: 1.5rem; padding: 10px; width: 90%; max-width: 300px; text-align: center; margin-bottom: 20px; }
        button { font-size: 1.2rem; padding: 15px; width: 90%; max-width: 300px; margin-bottom: 15px; cursor: pointer; }
        #reader { width: 100%; max-width: 350px; margin: 0 auto; display: none; }
    </style>
    <!-- Lightweight scanner library from CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <input type="text" id="barcode" placeholder="13-digit barcode" readonly>
    <button id="copyBtn">Copy Barcode</button>
    <button id="scanBtn">Scan Barcode</button>
    
    <div id="reader"></div>

    <script>
        const barcodeInput = document.getElementById('barcode');
        const readerDiv = document.getElementById('reader');
        let html5QrCode;

        // Copy functionality
        document.getElementById('copyBtn').addEventListener('click', () => {
            if (!barcodeInput.value) return;
            navigator.clipboard.writeText(barcodeInput.value)
                .then(() => alert('Copied: ' + barcodeInput.value))
                .catch(err => alert('Failed to copy'));
        });

        // Scan functionality
        document.getElementById('scanBtn').addEventListener('click', () => {
            if (html5QrCode && html5QrCode.isScanning) return;
            
            readerDiv.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" }, // Forces rear camera on mobile
                { fps: 10, qrbox: { width: 300, height: 150 } }, // Optimized scanning box for 1D barcodes
                (decodedText) => {
                    // On Success: Set text, stop camera, hide scanner
                    barcodeInput.value = decodedText;
                    html5QrCode.stop().then(() => {
                        readerDiv.style.display = 'none';
                    });
                },
                (errorMessage) => { 
                    // Ignore continuous scanning errors 
                }
            ).catch((err) => {
                alert("Camera permission denied or error: " + err);
            });
        });
    </script>

</body>
</html>
